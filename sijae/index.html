<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7AAA25">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="시재금 계산기">
<title>시재금 계산기</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
:root{--green:#7AAA25;--green2:#5f8f1f;--soft:#f3f8e9;--bg:#f7f8f5;--card:#fff;--text:#1f2619;--muted:#737a6d;--line:#e4e8df;--good:#287447;--warn:#9a6b15;--bad:#b83a3a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.app{max-width:540px;margin:auto;padding:18px 14px 42px}.top{display:flex;align-items:center;gap:10px;padding:8px 2px 12px}.logo{width:44px;height:44px}.title h1{font-size:23px;margin:0;font-weight:850}.sub{font-size:13px;color:var(--muted);margin-top:3px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px;box-shadow:0 5px 18px rgba(45,60,25,.05)}.target{display:flex;align-items:center;justify-content:space-between;gap:10px}.target strong{font-size:26px}.pill{font-size:12px;font-weight:750;padding:6px 9px;border-radius:999px;background:var(--soft);color:var(--green2)}h2{font-size:16px;margin:0 0 11px}.row{padding:11px 0;border-bottom:1px solid #eff1ec}.row:last-child{border-bottom:0}.rowhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:7px}.denom{font-weight:800}.amt,.small{font-size:12px;color:var(--muted)}.stepper{display:grid;grid-template-columns:48px 48px minmax(70px,1fr) 48px 48px;gap:6px}.stepper button,.actions button{min-height:44px;border-radius:12px;font-weight:800;font-size:14px}.stepper button{border:1px solid #dbe5ca;background:#fbfdf8;color:var(--green2)}.stepper button:active{background:#e8f2d7;transform:scale(.97)}input{width:100%;min-width:0;border:1px solid #ced8be;border-radius:12px;text-align:center;font-size:17px;font-weight:800;background:#fff;color:var(--text)}.actions{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;margin-top:14px}.actions button{border:0}.reset{background:#eef1eb;color:#3e4638}.calc{background:var(--green);color:#fff}.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:#f8faf5;border:1px solid var(--line);border-radius:15px;padding:13px}.metric span{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}.metric strong{font-size:20px}.result-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eff1ec}.result-row:last-child{border-bottom:0}.right{text-align:right}.notice{margin-top:12px;border-radius:14px;padding:12px;font-size:14px;line-height:1.5}.ok{background:#edf8f1;color:#24623f}.warn{background:#fff7e5;color:#875d14}.bad{background:#fff0f0;color:#9c3030}.foot{font-size:11px;color:#8a9184;text-align:center;margin-top:16px}@media(max-width:390px){.app{padding:12px 10px 36px}.stepper{grid-template-columns:43px 43px minmax(54px,1fr) 43px 43px;gap:4px}.stepper button{font-size:12px}.summary{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<div class="top"><img class="logo" src="./icon.svg" alt=""><div class="title"><h1>시재금 계산기</h1><div class="sub">송금 후 시재금 83,000원을 정확히 맞춰요</div></div></div>
<div class="card"><div class="target"><div><div class="small">목표 시재금</div><strong>83,000원</strong></div><span class="pill">만원권 시재 제외</span></div></div>
<div class="card"><h2>현재 보유 수량</h2><div id="rows"></div><div class="actions"><button type="button" class="reset" id="resetBtn">초기화</button><button type="button" class="calc" id="calcBtn">83,000원 맞추기</button></div></div>
<div class="card"><h2>계산 결과</h2><div class="summary"><div class="metric"><span>현재 현금 총액</span><strong id="total">0원</strong></div><div class="metric"><span>송금 대상액</span><strong id="send">-</strong></div></div><div id="results"></div><div id="exchangeBox" class="notice warn" style="display:none"></div><div id="status" class="notice warn" aria-live="polite">수량을 입력한 뒤 계산해 주세요.</div></div>
<div class="foot">동전은 가능한 한 적게 빼고, 필요한 경우 만원권 환전도 안내해요.</div>
</div>
<script>
const defs=[{d:50000,u:'장'},{d:10000,u:'장'},{d:5000,u:'장'},{d:1000,u:'장'},{d:500,u:'개'},{d:100,u:'개'},{d:50,u:'개'},{d:10,u:'개'}],TARGET=83000,denoms=defs.map(x=>x.d),rows=document.getElementById('rows');
const fmt=n=>Number(n).toLocaleString('ko-KR')+'원';
defs.forEach(x=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<div class="rowhead"><div class="denom">${x.d.toLocaleString('ko-KR')}원</div><div class="amt" id="a${x.d}">0원</div></div><div class="stepper"><button type="button" data-d="${x.d}" data-step="-10">-10</button><button type="button" data-d="${x.d}" data-step="-1">-1</button><input id="n${x.d}" type="number" min="0" value="0" inputmode="numeric" aria-label="${x.d}원 수량"><button type="button" data-d="${x.d}" data-step="1">+1</button><button type="button" data-d="${x.d}" data-step="10">+10</button></div>`;rows.appendChild(r)});
function counts(){const o={};denoms.forEach(d=>o[d]=Math.max(0,parseInt(document.getElementById('n'+d).value||'0',10)||0));return o}
function refresh(){const c=counts();let t=0;denoms.forEach(d=>{const a=c[d]*d;t+=a;document.getElementById('a'+d).textContent=fmt(a)});document.getElementById('total').textContent=fmt(t)}
document.querySelectorAll('.stepper button').forEach(b=>b.addEventListener('click',()=>{const i=document.getElementById('n'+b.dataset.d),v=Math.max(0,parseInt(i.value||'0',10)||0);i.value=Math.max(0,v+parseInt(b.dataset.step,10));refresh()}));denoms.forEach(d=>document.getElementById('n'+d).addEventListener('input',refresh));
function findExact(av){const ds=[5000,1000,500,100,50,10],cap=TARGET/10;let dp=new Array(cap+1).fill(null);dp[0]={s:0,c:{5000:0,1000:0,500:0,100:0,50:0,10:0}};const w=d=>d===10?1004000:d===50?1003000:d===100?1002000:d===500?1001000:d===1000?10:5;for(const d of ds){let left=av[d]||0,p=1,b=[];while(left>0){const q=Math.min(p,left);b.push(q);left-=q;p*=2}for(const q of b){const wt=d*q/10,sc=w(d)*q;for(let s=cap;s>=wt;s--){const prev=dp[s-wt];if(!prev)continue;const ns=prev.s+sc;if(!dp[s]||ns>dp[s].s){const c={...prev.c};c[d]+=q;dp[s]={s:ns,c}}}}}return dp[cap]?.c||null}
function calculate(){const a=counts(),total=denoms.reduce((s,d)=>s+a[d]*d,0),result=document.getElementById('results'),status=document.getElementById('status'),ex=document.getElementById('exchangeBox');result.innerHTML='';ex.style.display='none';document.getElementById('total').textContent=fmt(total);if(total<TARGET){document.getElementById('send').textContent='-';status.className='notice bad';status.textContent='현재 현금이 '+fmt(TARGET-total)+' 부족해요.';return}let av={...a,50000:0,10000:0},keep=findExact(av),exchange=null;if(!keep&&a[10000]>0){outer:for(let m=1;m<=a[10000];m++){for(let f=2*m;f>=0;f--){const rem=10000*m-5000*f;if(rem<0||rem%1000)continue;const t=rem/1000,v={...av,5000:av[5000]+f,1000:av[1000]+t},k=findExact(v);if(k){keep=k;exchange={m,f,t};av=v;break outer}}}}if(!keep){document.getElementById('send').textContent='-';status.className='notice bad';status.innerHTML='<strong>83,000원을 정확히 만들 수 없어요.</strong><br>현재 권종 또는 환전 가능한 지폐가 부족해요.';return}document.getElementById('send').textContent=fmt(total-TARGET);const kept={50000:0,10000:0,...keep};defs.forEach(x=>{let available=a[x.d],extra='';if(exchange&&x.d===5000){available+=exchange.f;extra=exchange.f?' · 환전 +'+exchange.f+'장':''}if(exchange&&x.d===1000){available+=exchange.t;extra=exchange.t?' · 환전 +'+exchange.t+'장':''}let out=available-(kept[x.d]||0);if(exchange&&x.d===10000)out=a[10000]-exchange.m;const r=document.createElement('div');r.className='result-row';r.innerHTML=`<div><strong>${x.d.toLocaleString('ko-KR')}원</strong><div class="small">보유 ${a[x.d]}${x.u}${extra}</div></div><div class="right"><strong>남김 ${kept[x.d]||0}${x.u}</strong><div class="small">${exchange&&x.d===10000?'송금 '+out+x.u+' / 환전 '+exchange.m+x.u:'송금 '+out+x.u}</div></div>`;result.appendChild(r)});if(exchange){ex.style.display='block';const p=[];if(exchange.f)p.push('5,000원권 '+exchange.f+'장');if(exchange.t)p.push('1,000원권 '+exchange.t+'장');ex.innerHTML='<strong>환전 필요</strong><br>10,000원권 '+exchange.m+'장을 '+p.join(' + ')+'으로 바꿔 주세요.'}status.className='notice ok';status.innerHTML='<strong>정확히 83,000원!</strong><br>송금 대상액은 '+fmt(total-TARGET)+'이에요.'}
document.getElementById('calcBtn').addEventListener('click',calculate);document.getElementById('resetBtn').addEventListener('click',()=>{denoms.forEach(d=>document.getElementById('n'+d).value=0);refresh();document.getElementById('send').textContent='-';document.getElementById('results').innerHTML='';document.getElementById('exchangeBox').style.display='none';const s=document.getElementById('status');s.className='notice warn';s.textContent='수량을 입력한 뒤 계산해 주세요.'});refresh();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
