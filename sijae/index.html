<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7AAA25">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="POS 준비금">
<title>POS 준비금</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
:root{--green:#7AAA25;--green2:#5f8f1f;--soft:#f3f8e9;--bg:#f7f8f5;--card:#fff;--text:#1f2619;--muted:#737a6d;--line:#e4e8df;--good:#287447;--warn:#9a6b15;--bad:#b83a3a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.app{max-width:560px;margin:auto;padding:18px 14px 42px}.top{display:flex;align-items:center;gap:10px;padding:8px 2px 12px}.logo{width:44px;height:44px}.title h1{font-size:23px;margin:0;font-weight:850}.sub{font-size:13px;color:var(--muted);margin-top:3px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px;box-shadow:0 5px 18px rgba(45,60,25,.05)}.overview{background:linear-gradient(180deg,#f7fbea,#fff)}.target{display:flex;align-items:center;justify-content:space-between;gap:10px}.target strong{font-size:26px}.pill{font-size:12px;font-weight:750;padding:6px 9px;border-radius:999px;background:var(--soft);color:var(--green2)}h2{font-size:16px;margin:0 0 11px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.tab{border:1px solid #dbe5ca;background:#fff;color:#5d6755;padding:11px 6px;border-radius:13px;font-size:14px;font-weight:800}.tab.active{background:var(--green);border-color:var(--green);color:#fff}.pos-panel{display:none}.pos-panel.active{display:block}.row{padding:11px 0;border-bottom:1px solid #eff1ec}.row:last-child{border-bottom:0}.rowhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:7px}.denom{font-weight:800}.amt,.small{font-size:12px;color:var(--muted)}.stepper{display:grid;grid-template-columns:48px 48px minmax(70px,1fr) 48px 48px;gap:6px}.stepper button,.actions button,.allbtn{min-height:44px;border-radius:12px;font-weight:800;font-size:14px}.stepper button{border:1px solid #dbe5ca;background:#fbfdf8;color:var(--green2)}.stepper button:active{background:#e8f2d7;transform:scale(.97)}input{width:100%;min-width:0;border:1px solid #ced8be;border-radius:12px;text-align:center;font-size:17px;font-weight:800;background:#fff;color:var(--text)}.actions{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;margin-top:14px}.actions button,.allbtn{border:0}.reset{background:#eef1eb;color:#3e4638}.calc,.allbtn{background:var(--green);color:#fff}.allbtn{width:100%;margin-top:12px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:#f8faf5;border:1px solid var(--line);border-radius:15px;padding:13px}.metric span{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}.metric strong{font-size:20px}.grand{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.grand-row{display:flex;justify-content:space-between;gap:12px;align-items:end}.grand-row strong{font-size:26px;color:var(--green2)}.result-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eff1ec}.result-row:last-child{border-bottom:0}.right{text-align:right}.notice{margin-top:12px;border-radius:14px;padding:12px;font-size:14px;line-height:1.5}.ok{background:#edf8f1;color:#24623f}.warn{background:#fff7e5;color:#875d14}.bad{background:#fff0f0;color:#9c3030}.foot{font-size:11px;color:#8a9184;text-align:center;margin-top:16px}@media(max-width:390px){.app{padding:12px 10px 36px}.stepper{grid-template-columns:43px 43px minmax(54px,1fr) 43px 43px;gap:4px}.stepper button{font-size:12px}.summary{grid-template-columns:1fr}.grand-row{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<div class="top"><img class="logo" src="./icon.svg" alt=""><div class="title"><h1>POS 준비금</h1><div class="sub">POS 3대 준비금과 총 송금대상액을 한 번에 계산해요</div></div></div>
<div class="card overview"><div class="target"><div><div class="small">POS 1대당 목표 준비금</div><strong>83,000원</strong></div><span class="pill">3대 총 249,000원</span></div><div class="grand"><div class="grand-row"><div><div class="small">3대 총 송금대상액</div><strong id="grandSend">-</strong></div><div class="small" id="grandStatus">POS 3대를 모두 입력해 주세요.</div></div></div><button type="button" class="allbtn" id="allCalcBtn">POS 3대 한 번에 계산</button></div>
<div class="tabs"><button class="tab active" data-pos="1">POS 1</button><button class="tab" data-pos="2">POS 2</button><button class="tab" data-pos="3">POS 3</button></div>
<div id="posPanels"></div>
<div class="foot">각 POS는 83,000원을 정확히 남기고, 동전은 가능한 한 적게 빼요. 필요하면 10,000원권 또는 50,000원권 환전도 안내해요.</div>
</div>
<script>
const defs=[{d:50000,u:'장'},{d:10000,u:'장'},{d:5000,u:'장'},{d:1000,u:'장'},{d:500,u:'개'},{d:100,u:'개'},{d:50,u:'개'},{d:10,u:'개'}],TARGET=83000,POS_COUNT=3,denoms=defs.map(x=>x.d),panels=document.getElementById('posPanels');
const fmt=n=>Number(n).toLocaleString('ko-KR')+'원';
function panelHtml(p){return `<section class="pos-panel ${p===1?'active':''}" data-panel="${p}"><div class="card"><h2>POS ${p} 현재 보유 수량</h2><div id="rows${p}"></div><div class="actions"><button type="button" class="reset" data-reset="${p}">초기화</button><button type="button" class="calc" data-calc="${p}">POS ${p} 계산</button></div></div><div class="card"><h2>POS ${p} 계산 결과</h2><div class="summary"><div class="metric"><span>현재 현금 총액</span><strong id="total${p}">0원</strong></div><div class="metric"><span>송금 대상액</span><strong id="send${p}">-</strong></div></div><div id="results${p}"></div><div id="exchange${p}" class="notice warn" style="display:none"></div><div id="status${p}" class="notice warn" aria-live="polite">수량을 입력한 뒤 계산해 주세요.</div></div></section>`}
for(let p=1;p<=POS_COUNT;p++){panels.insertAdjacentHTML('beforeend',panelHtml(p));const rows=document.getElementById('rows'+p);defs.forEach(x=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<div class="rowhead"><div class="denom">${x.d.toLocaleString('ko-KR')}원</div><div class="amt" id="a${p}_${x.d}">0원</div></div><div class="stepper"><button type="button" data-pos="${p}" data-d="${x.d}" data-step="-10">-10</button><button type="button" data-pos="${p}" data-d="${x.d}" data-step="-1">-1</button><input id="n${p}_${x.d}" type="number" min="0" value="0" inputmode="numeric" aria-label="POS ${p} ${x.d}원 수량"><button type="button" data-pos="${p}" data-d="${x.d}" data-step="1">+1</button><button type="button" data-pos="${p}" data-d="${x.d}" data-step="10">+10</button></div>`;rows.appendChild(r)})}
function counts(p){const o={};denoms.forEach(d=>o[d]=Math.max(0,parseInt(document.getElementById(`n${p}_${d}`).value||'0',10)||0));return o}
function totalFor(p){const c=counts(p);return denoms.reduce((s,d)=>s+c[d]*d,0)}
function refresh(p){const c=counts(p);let t=0;denoms.forEach(d=>{const a=c[d]*d;t+=a;document.getElementById(`a${p}_${d}`).textContent=fmt(a)});document.getElementById('total'+p).textContent=fmt(t);updateGrandPreview()}
function updateGrandPreview(){const total=Array.from({length:POS_COUNT},(_,i)=>totalFor(i+1)).reduce((a,b)=>a+b,0);document.getElementById('grandStatus').textContent=total?`현재 3대 현금 합계 ${fmt(total)}`:'POS 3대를 모두 입력해 주세요.'}
document.querySelectorAll('.stepper button').forEach(b=>b.addEventListener('click',()=>{const p=b.dataset.pos,d=b.dataset.d,i=document.getElementById(`n${p}_${d}`),v=Math.max(0,parseInt(i.value||'0',10)||0);i.value=Math.max(0,v+parseInt(b.dataset.step,10));refresh(Number(p))}));
for(let p=1;p<=POS_COUNT;p++)denoms.forEach(d=>document.getElementById(`n${p}_${d}`).addEventListener('input',()=>refresh(p)));
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));document.querySelectorAll('.pos-panel').forEach(x=>x.classList.toggle('active',x.dataset.panel===t.dataset.pos))}));
function findExact(av){const ds=[5000,1000,500,100,50,10],cap=TARGET/10;let dp=new Array(cap+1).fill(null);dp[0]={s:0,c:{5000:0,1000:0,500:0,100:0,50:0,10:0}};const w=d=>d===10?1004000:d===50?1003000:d===100?1002000:d===500?1001000:d===1000?10:5;for(const d of ds){let left=av[d]||0,p=1,b=[];while(left>0){const q=Math.min(p,left);b.push(q);left-=q;p*=2}for(const q of b){const wt=d*q/10,sc=w(d)*q;for(let s=cap;s>=wt;s--){const prev=dp[s-wt];if(!prev)continue;const ns=prev.s+sc;if(!dp[s]||ns>dp[s].s){const c={...prev.c};c[d]+=q;dp[s]={s:ns,c}}}}}return dp[cap]?.c||null}
function findWithExchange(a){const base={...a,50000:0,10000:0};let keep=findExact(base);if(keep)return {keep,exchange:{m50:0,m10:0,add5000:0,add1000:0}};let best=null;for(let m50=0;m50<=a[50000];m50++){for(let m10=0;m10<=a[10000];m10++){if(m50===0&&m10===0)continue;for(let f10=0;f10<=2*m10;f10++){const add5000=m50*10+f10,add1000=m10*10-f10*5;const v={...base,5000:base[5000]+add5000,1000:base[1000]+add1000};const k=findExact(v);if(!k)continue;const score=m50*50000+m10*10000;const notes=m50+m10;if(!best||score<best.score||(score===best.score&&notes<best.notes)){best={keep:k,exchange:{m50,m10,add5000,add1000},score,notes}}}}}return best}
function calculate(p,quiet=false){const a=counts(p),total=totalFor(p),result=document.getElementById('results'+p),status=document.getElementById('status'+p),ex=document.getElementById('exchange'+p);result.innerHTML='';ex.style.display='none';document.getElementById('total'+p).textContent=fmt(total);if(total<TARGET){document.getElementById('send'+p).textContent='-';status.className='notice bad';status.textContent='현재 현금이 '+fmt(TARGET-total)+' 부족해요.';return {ok:false,total,send:0}}const solved=findWithExchange(a);if(!solved){document.getElementById('send'+p).textContent='-';status.className='notice bad';status.innerHTML='<strong>83,000원을 정확히 만들 수 없어요.</strong><br>현재 권종 또는 환전 가능한 지폐가 부족해요.';return {ok:false,total,send:0}}const keep=solved.keep,exchange=solved.exchange,send=total-TARGET;document.getElementById('send'+p).textContent=fmt(send);const kept={50000:0,10000:0,...keep};defs.forEach(x=>{let available=a[x.d],extra='';if(x.d===5000&&exchange.add5000){available+=exchange.add5000;extra=' · 환전 +'+exchange.add5000+'장'}if(x.d===1000&&exchange.add1000){available+=exchange.add1000;extra=' · 환전 +'+exchange.add1000+'장'}let out=available-(kept[x.d]||0);let detail='송금 '+out+x.u;if(x.d===50000&&exchange.m50){out=a[50000]-exchange.m50;detail='송금 '+out+x.u+' / 환전 '+exchange.m50+x.u}if(x.d===10000&&exchange.m10){out=a[10000]-exchange.m10;detail='송금 '+out+x.u+' / 환전 '+exchange.m10+x.u}const r=document.createElement('div');r.className='result-row';r.innerHTML=`<div><strong>${x.d.toLocaleString('ko-KR')}원</strong><div class="small">보유 ${a[x.d]}${x.u}${extra}</div></div><div class="right"><strong>남김 ${kept[x.d]||0}${x.u}</strong><div class="small">${detail}</div></div>`;result.appendChild(r)});if(exchange.m50||exchange.m10){ex.style.display='block';const parts=[];if(exchange.m50)parts.push(`50,000원권 ${exchange.m50}장 → 5,000원권 ${exchange.m50*10}장`);if(exchange.m10){const from10=[];const fFrom10=exchange.add5000-exchange.m50*10;if(fFrom10)from10.push(`5,000원권 ${fFrom10}장`);if(exchange.add1000)from10.push(`1,000원권 ${exchange.add1000}장`);parts.push(`10,000원권 ${exchange.m10}장 → ${from10.join(' + ')}`)}ex.innerHTML='<strong>환전 필요</strong><br>'+parts.join('<br>')}status.className='notice ok';status.innerHTML='<strong>정확히 83,000원!</strong><br>POS '+p+' 송금 대상액은 '+fmt(send)+'이에요.';return {ok:true,total,send}}
document.querySelectorAll('[data-calc]').forEach(b=>b.addEventListener('click',()=>calculate(Number(b.dataset.calc))));
document.querySelectorAll('[data-reset]').forEach(b=>b.addEventListener('click',()=>{const p=Number(b.dataset.reset);denoms.forEach(d=>document.getElementById(`n${p}_${d}`).value=0);refresh(p);document.getElementById('send'+p).textContent='-';document.getElementById('results'+p).innerHTML='';document.getElementById('exchange'+p).style.display='none';const s=document.getElementById('status'+p);s.className='notice warn';s.textContent='수량을 입력한 뒤 계산해 주세요.';document.getElementById('grandSend').textContent='-'}));
document.getElementById('allCalcBtn').addEventListener('click',()=>{const r=[1,2,3].map(p=>calculate(p,true));const g=document.getElementById('grandSend'),gs=document.getElementById('grandStatus');if(r.every(x=>x.ok)){const sum=r.reduce((s,x)=>s+x.send,0);g.textContent=fmt(sum);gs.textContent=`3대 현금 합계 ${fmt(r.reduce((s,x)=>s+x.total,0))} - 총 준비금 249,000원`;}else{g.textContent='계산 불가';gs.textContent='83,000원을 정확히 맞출 수 없는 POS가 있어요. 각 POS 결과를 확인해 주세요.'}});
for(let p=1;p<=POS_COUNT;p++)refresh(p);
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
