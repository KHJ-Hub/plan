<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7AAA25"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="POS 준비금"><title>POS 준비금</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon.svg"><style>:root{--g:#7aaa25;--gd:#5f8f1f;--bg:#f7f8f5;--card:#fff;--line:#e4e8df;--txt:#1f2619;--mut:#737a6d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.app{max-width:560px;margin:auto;padding:16px 12px 40px}.top{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px}h1{font-size:23px;margin:0}.sub,.small{font-size:12px;color:var(--mut)}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:15px;margin-top:12px;box-shadow:0 5px 18px rgba(45,60,25,.05)}.hero{background:linear-gradient(#f5fbe9,#fff)}.target{display:flex;justify-content:space-between;align-items:center;gap:10px}.target strong{font-size:25px}.pill{font-size:12px;font-weight:800;background:#eef6df;color:var(--gd);padding:6px 9px;border-radius:999px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.tab{border:1px solid #dbe5ca;background:#fff;color:#56604d;border-radius:13px;padding:11px 6px;font-weight:800}.tab.active{background:var(--g);color:#fff;border-color:var(--g)}.panel{display:none}.panel.active{display:block}h2{font-size:16px;margin:0 0 8px}.row{padding:10px 0;border-bottom:1px solid #eff1ec}.row:last-child{border:0}.rowhead{display:flex;justify-content:space-between;margin-bottom:7px}.denom{font-weight:800}.stepper{display:grid;grid-template-columns:46px 46px minmax(62px,1fr) 46px 46px;gap:5px}.stepper button,.actions button,.allbtn{min-height:43px;border-radius:12px;font-weight:800}.stepper button{border:1px solid #dbe5ca;background:#fbfdf8;color:var(--gd)}input{width:100%;min-width:0;border:1px solid #ced8be;border-radius:12px;text-align:center;font-size:17px;font-weight:800;background:#fff;color:var(--txt)}.actions{display:grid;grid-template-columns:1fr 1.45fr;gap:8px;margin-top:12px}.actions button,.allbtn{border:0}.reset{background:#eef1eb;color:#3e4638}.calc,.allbtn{background:var(--g);color:#fff}.allbtn{width:100%;margin-top:12px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#f8faf5;border:1px solid var(--line);border-radius:14px;padding:12px}.metric span{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}.metric strong{font-size:19px}.result-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #eff1ec}.right{text-align:right}.notice{margin-top:11px;padding:11px;border-radius:13px;font-size:14px;line-height:1.45}.ok{background:#edf8f1;color:#24623f}.warn{background:#fff7e5;color:#875d14}.bad{background:#fff0f0;color:#9c3030}.grand{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.grand strong{font-size:25px;color:var(--gd)}@media(max-width:390px){.stepper{grid-template-columns:42px 42px minmax(52px,1fr) 42px 42px}.stepper button{font-size:12px}.summary{grid-template-columns:1fr}}</style></head><body><div class="app"><div class="top"><img class="logo" src="./icon.svg" alt=""><div><h1>POS 준비금</h1><div class="sub">POS 3대 준비금과 총 송금대상액 계산</div></div></div><div class="card hero"><div class="target"><div><div class="small">POS 1대당 목표 준비금</div><strong>83,000원</strong></div><span class="pill">3대 총 249,000원</span></div><div class="grand"><div class="small">3대 총 송금대상액</div><strong id="grandSend">-</strong><div class="small" id="grandStatus">POS 3대를 입력해 주세요.</div></div><button id="allCalc" class="allbtn">POS 3대 한 번에 계산</button></div><div class="tabs"><button class="tab active" data-tab="1">POS 1</button><button class="tab" data-tab="2">POS 2</button><button class="tab" data-tab="3">POS 3</button></div><div id="panels"></div></div><script>const TARGET=83000,POS=3,defs=[{d:50000,u:'장'},{d:10000,u:'장'},{d:5000,u:'장'},{d:1000,u:'장'},{d:500,u:'개'},{d:100,u:'개'},{d:50,u:'개'},{d:10,u:'개'}],denoms=defs.map(x=>x.d),fmt=n=>Number(n).toLocaleString('ko-KR')+'원';const panels=document.getElementById('panels');for(let p=1;p<=POS;p++){panels.insertAdjacentHTML('beforeend',`<section class="panel ${p===1?'active':''}" data-panel="${p}"><div class="card"><h2>POS ${p} 현재 보유 수량</h2><div class="small">없는 권종은 0 또는 빈칸으로 두면 돼요.</div><div id="rows${p}"></div><div class="actions"><button class="reset" data-reset="${p}">초기화</button><button class="calc" data-calc="${p}">POS ${p} 계산</button></div></div><div class="card"><h2>POS ${p} 계산 결과</h2><div class="summary"><div class="metric"><span>현재 현금 총액</span><strong id="total${p}">0원</strong></div><div class="metric"><span>송금 대상액</span><strong id="send${p}">-</strong></div></div><div id="results${p}"></div><div id="exchange${p}" class="notice warn" style="display:none"></div><div id="status${p}" class="notice warn">수량을 입력한 뒤 계산해 주세요.</div></div></section>`);const rows=document.getElementById('rows'+p);defs.forEach(x=>rows.insertAdjacentHTML('beforeend',`<div class="row"><div class="rowhead"><div class="denom">${x.d.toLocaleString()}원</div><div class="small" id="amt${p}_${x.d}">0원</div></div><div class="stepper"><button data-p="${p}" data-d="${x.d}" data-s="-10">-10</button><button data-p="${p}" data-d="${x.d}" data-s="-1">-1</button><input id="n${p}_${x.d}" type="number" min="0" value="0" inputmode="numeric"><button data-p="${p}" data-d="${x.d}" data-s="1">+1</button><button data-p="${p}" data-d="${x.d}" data-s="10">+10</button></div></div>`))}function val(id){const el=document.getElementById(id);const n=parseInt((el?.value??'').trim(),10);return Number.isFinite(n)&&n>0?n:0}function counts(p){const o={};denoms.forEach(d=>o[d]=val(`n${p}_${d}`));return o}function total(p){const c=counts(p);return denoms.reduce((s,d)=>s+c[d]*d,0)}function refresh(p){const c=counts(p);let t=0;denoms.forEach(d=>{const a=c[d]*d;t+=a;document.getElementById(`amt${p}_${d}`).textContent=fmt(a)});document.getElementById('total'+p).textContent=fmt(t);const gt=[1,2,3].reduce((s,x)=>s+total(x),0);document.getElementById('grandStatus').textContent=gt?`현재 3대 현금 합계 ${fmt(gt)}`:'POS 3대를 입력해 주세요.'}document.querySelectorAll('.stepper button').forEach(b=>b.onclick=()=>{const i=document.getElementById(`n${b.dataset.p}_${b.dataset.d}`),cur=val(i.id);i.value=Math.max(0,cur+Number(b.dataset.s));refresh(Number(b.dataset.p))});document.querySelectorAll('input').forEach(i=>i.oninput=()=>refresh(Number(i.id.split('_')[0].slice(1))));document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.dataset.panel===b.dataset.tab))});function solveExact(av){const ds=[5000,1000,500,100,50,10],cap=TARGET/10;let dp=Array(cap+1).fill(null);dp[0]={score:0,c:{5000:0,1000:0,500:0,100:0,50:0,10:0}};const keepScore=d=>d<=500?1000000+(500-d):d===1000?10:5;for(const d of ds){let n=Math.max(0,av[d]||0),k=1,b=[];while(n>0){const q=Math.min(k,n);b.push(q);n-=q;k*=2}for(const q of b){const w=d*q/10,s=keepScore(d)*q;for(let a=cap;a>=w;a--){const prev=dp[a-w];if(!prev)continue;const ns=prev.score+s;if(!dp[a]||ns>dp[a].score){const c={...prev.c};c[d]+=q;dp[a]={score:ns,c}}}}}return dp[cap]?.c||null}function solveWithExchange(a){const base={...a,50000:0,10000:0};let k=solveExact(base);if(k)return{keep:k,ex:{m50:0,m10:0,a5:0,a1:0}};let best=null;const max50=Math.min(a[50000],2),max10=Math.min(a[10000],9);for(let m50=0;m50<=max50;m50++)for(let m10=0;m10<=max10;m10++){if(!m50&&!m10)continue;for(let f=0;f<=2*m10;f++){const a5=m50*10+f,a1=m10*10-f*5,v={...base,5000:base[5000]+a5,1000:base[1000]+a1},keep=solveExact(v);if(!keep)continue;const cost=m50*50000+m10*10000,notes=m50+m10;if(!best||cost<best.cost||(cost===best.cost&&notes<best.notes))best={keep,ex:{m50,m10,a5,a1},cost,notes}}}return best}function calc(p){const a=counts(p),t=total(p),res=document.getElementById('results'+p),st=document.getElementById('status'+p),exb=document.getElementById('exchange'+p);res.innerHTML='';exb.style.display='none';if(t<TARGET){document.getElementById('send'+p).textContent='-';st.className='notice bad';st.textContent=`현재 현금이 ${fmt(TARGET-t)} 부족해요.`;return{ok:false,total:t,send:0}}const sol=solveWithExchange(a);if(!sol){document.getElementById('send'+p).textContent='-';st.className='notice bad';st.innerHTML='<strong>83,000원을 정확히 만들 수 없어요.</strong><br>없는 권종은 0으로 정상 처리됐고, 현재 가진 권종과 허용된 환전만으로 정확한 조합이 없는 상태예요.';return{ok:false,total:t,send:0}}const send=t-TARGET,keep={50000:0,10000:0,...sol.keep},e=sol.ex;document.getElementById('send'+p).textContent=fmt(send);defs.forEach(x=>{let available=a[x.d],extra='';if(x.d===5000&&e.a5){available+=e.a5;extra=` · 환전 +${e.a5}장`}if(x.d===1000&&e.a1){available+=e.a1;extra=` · 환전 +${e.a1}장`}let out=available-(keep[x.d]||0),detail=`송금 ${out}${x.u}`;if(x.d===50000&&e.m50){out=a[50000]-e.m50;detail=`송금 ${out}장 / 환전 ${e.m50}장`}if(x.d===10000&&e.m10){out=a[10000]-e.m10;detail=`송금 ${out}장 / 환전 ${e.m10}장`}res.insertAdjacentHTML('beforeend',`<div class="result-row"><div><strong>${x.d.toLocaleString()}원</strong><div class="small">보유 ${a[x.d]}${x.u}${extra}</div></div><div class="right"><strong>남김 ${keep[x.d]||0}${x.u}</strong><div class="small">${detail}</div></div></div>`)});if(e.m50||e.m10){const parts=[];if(e.m50)parts.push(`50,000원권 ${e.m50}장 → 5,000원권 ${e.m50*10}장`);if(e.m10){const f=e.a5-e.m50*10,q=[];if(f)q.push(`5,000원권 ${f}장`);if(e.a1)q.push(`1,000원권 ${e.a1}장`);parts.push(`10,000원권 ${e.m10}장 → ${q.join(' + ')}`)}exb.style.display='block';exb.innerHTML='<strong>환전 필요</strong><br>'+parts.join('<br>')}st.className='notice ok';st.innerHTML=`<strong>정확히 83,000원!</strong><br>POS ${p} 송금 대상액은 ${fmt(send)}이에요.`;return{ok:true,total:t,send}}document.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>calc(Number(b.dataset.calc)));document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{const p=Number(b.dataset.reset);denoms.forEach(d=>document.getElementById(`n${p}_${d}`).value=0);refresh(p);document.getElementById('send'+p).textContent='-';document.getElementById('results'+p).innerHTML='';document.getElementById('exchange'+p).style.display='none';document.getElementById('status'+p).className='notice warn';document.getElementById('status'+p).textContent='수량을 입력한 뒤 계산해 주세요.';document.getElementById('grandSend').textContent='-'});document.getElementById('allCalc').onclick=()=>{const r=[1,2,3].map(calc),g=document.getElementById('grandSend'),s=document.getElementById('grandStatus');if(r.every(x=>x.ok)){g.textContent=fmt(r.reduce((a,x)=>a+x.send,0));s.textContent=`3대 현금 합계 ${fmt(r.reduce((a,x)=>a+x.total,0))} - 총 준비금 249,000원`}else{g.textContent='계산 불가';s.textContent='정확히 83,000원을 만들 수 없는 POS가 있어요.'}};for(let p=1;p<=3;p++)refresh(p);if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
