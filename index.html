<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고교학점제 과목 설계</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        :root {
            --primary: #9b82d3; /* 세련된 연보라색 포인트 */
            --primary-hover: #8367c7;
            --bg-color: #f4f5f7;
            --surface: #ffffff;
            --text-main: #191f28;
            --text-sub: #8b95a1;
        }
        body {
            background-color: var(--bg-color);
            font-family: 'Pretendard', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: var(--surface);
            width: 90%;
            max-width: 360px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.08);
            text-align: center;
            box-sizing: border-box;
        }
        .icon-wrap {
            font-size: 44px;
            margin-bottom: 16px;
        }
        h1 {
            margin: 0 0 12px 0;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }
        p.desc {
            margin: 0 0 32px 0;
            font-size: 15px;
            color: var(--text-sub);
            word-break: keep-all;
            line-height: 1.5;
        }
        .input-box {
            position: relative;
            margin-bottom: 24px;
        }
        input {
            width: 100%;
            padding: 18px 20px;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
            background-color: #f9fafb;
            border: 2px solid transparent;
            border-radius: 16px;
            box-sizing: border-box;
            text-align: center;
            letter-spacing: 2px;
            transition: all 0.2s ease;
        }
        input::placeholder {
            color: #b0b8c1;
            font-weight: 400;
            letter-spacing: normal;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: var(--surface);
            box-shadow: 0 0 0 4px rgba(155, 130, 211, 0.15);
        }
        .btn-start {
            width: 100%;
            padding: 18px;
            font-size: 17px;
            font-weight: 700;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .btn-start:hover {
            background-color: var(--primary-hover);
        }
        .btn-start:active {
            transform: scale(0.98); /* 클릭 시 살짝 눌리는 애니메이션 */
        }
        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            background-color: #f1f3f5;
            color: var(--text-sub);
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="status-badge" id="db-status">데이터베이스 연결 대기중</div>
        
        <div class="icon-wrap">🧭</div>
        <h1>과목 설계 시작하기</h1>
        <p class="desc">나의 진로에 맞는 과목을<br>선택하고 저장해 보세요.</p>
        
        <div class="input-box">
            <input type="text" id="studentId" placeholder="학번 5자리 입력" maxlength="5" pattern="\d*">
        </div>
        
        <button class="btn-start" onclick="login()">입장하기</button>
    </div>
    
    <script>
        function login() {
            const studentId = document.getElementById('studentId').value;
            if(studentId.length !== 5 || isNaN(studentId)) {
                alert("학번 5자리를 정확히 입력해주세요. (예: 10101)");
                return;
            }
            // 나중에 여기에 실제 다음 페이지로 넘어가는 기능을 넣을 겁니다.
            alert(studentId + " 학생 확인 완료! (아직 다음 화면은 공사 중입니다 🚧)");
        }
    </script>
</body>
</html>
