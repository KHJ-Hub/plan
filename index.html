<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>배정고 수강신청 안내서 💖</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏫</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hi+Melody&display=swap" rel="stylesheet">
    
    <style>
        /* 선생님의 원본 CSS를 단 1픽셀도 변경하지 않고 그대로 고정했습니다. */
        :root {
            --primary: #c3bef0; 
            --primary-hover: #b19cd9;
            --bg-color: #fef1f8; 
            --surface: #ffffff;
            --text-main: #333333; 
            --text-sub: #b0b8c1;
        }
        
        body {
            background-color: var(--bg-color);
            font-family: 'Hi Melody', cursive, sans-serif; 
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-image: radial-gradient(#ffe4e1 1px, transparent 1px), radial-gradient(#ffe4e1 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        .content-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px; 
            padding-bottom: 110px; 
        }

        .card {
            background-color: var(--surface);
            width: 100%;
            max-width: 560px; 
            padding: 48px 56px; 
            border-radius: 40px; 
            box-shadow: 0 20px 50px rgba(255, 192, 203, 0.3);
            text-align: center;
            box-sizing: border-box;
            border: 3px solid #fce4ec; 
        }

        .icon-wrap {
            font-size: 64px; 
            margin-bottom: 16px; 
            animation: twinkle 2s infinite;
        }
        
        h1 {
            margin: 0 0 16px 0; 
            font-size: 38px; 
            color: #6a5acd; 
            letter-spacing: 0.5px;
            font-weight: bold; 
            white-space: nowrap; 
            text-shadow: 1px 1px 2px rgba(106, 90, 205, 0.15); 
        }
        
        p.desc {
            margin: 0 0 32px 0; 
            font-size: 24px; 
            color: #555555; 
            word-break: keep-all;
            line-height: 1.4;
            font-weight: bold; 
            text-shadow: 0.5px 0.5px 0px rgba(0,0,0,0.05); 
        }
        
        .input-box {
            margin-bottom: 24px; 
        }
        
        input {
            width: 100%;
            padding: 18px; 
            font-family: 'Hi Melody', cursive, sans-serif; 
            font-size: 24px; 
            color: var(--text-main);
            background-color: #fffaf0; 
            border: 3px solid #fce4ec; 
            border-radius: 20px;
            box-sizing: border-box;
            text-align: center;
            letter-spacing: 4px;
            transition: all 0.2s ease;
            font-weight: bold;
        }
        
        input::placeholder {
            color: #c0c0c0;
            letter-spacing: 1px;
            font-size: 22px;
            font-weight: normal;
        }
        
        input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: var(--surface);
            box-shadow: 0 0 0 5px rgba(195, 190, 240, 0.3);
        }
        
        .btn-start {
            width: 100%;
            padding: 18px; 
            font-family: 'Hi Melody', cursive, sans-serif; 
            font-size: 26px; 
            color: white;
            background-image: linear-gradient(120deg, #c3bef0 0%, #fad0c4 100%);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(195, 190, 240, 0.4);
            transition: all 0.3s ease;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.15); 
        }
        
        .btn-start:hover {
            transform: translateY(-3px); 
            box-shadow: 0 12px 25px rgba(195, 190, 240, 0.5);
        }
        
        .btn-start:active {
            transform: translateY(1px) scale(0.98);
        }
        
        .status-badge {
            display: inline-block;
            padding: 10px 20px;
            background-color: #fff0f5; 
            color: #ff69b4; 
            font-size: 18px;
            border-radius: 20px;
            margin-bottom: 24px;
            border: 2px solid #fce4ec;
            font-weight: bold;
        }

        .footer {
            position: fixed; 
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 24px; 
            font-family: 'Hi Melody', cursive, sans-serif; 
            font-size: 24px; 
            color: #6a5acd; 
            font-weight: bold;
            background-image: linear-gradient(to top, #fad0c4 0%, #ffd1ff 100%);
            box-sizing: border-box;
            border-radius: 30px 30px 0 0; 
            z-index: 10;
            box-shadow: 0 -10px 30px rgba(255, 192, 203, 0.2);
            text-shadow: 1px 1px 3px rgba(255,255,255,0.8), -1px -1px 3px rgba(255,255,255,0.8);
        }

        .heart-icon { display: inline-block; animation: pulse 1.5s infinite; margin: 0 6px; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        @keyframes twinkle { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.1) rotate(5deg); } 100% { opacity: 1; transform: scale(1); } }

        /* 🔥 원본 디자인을 유지하며 탭 메뉴 구현을 위해 하단에 추가된 귀여운 스타일 세트 */
        .tab-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            font-family: 'Hi Melody', cursive, sans-serif;
            font-size: 24px;
            font-weight: bold;
            border: 3px solid #fce4ec;
            border-radius: 20px;
            background-color: #fffaf0;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background-image: linear-gradient(120deg, #c3bef0 0%, #fad0c4 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 6px 15px rgba(195, 190, 240, 0.4);
        }

        /* 스마트폰/태블릿을 위한 맞춤 여백 */
        @media screen and (max-width: 768px) {
            .content-wrapper { padding-bottom: 80px; }
            .card { padding: 40px 24px; border-radius: 30px; }
            .status-badge { margin-bottom: 16px; padding: 6px 16px; }
            .icon-wrap { font-size: 52px; margin-bottom: 16px; }
            h1 { font-size: clamp(22px, 6.5vw, 32px); margin-bottom: 16px; }
            p.desc { font-size: 20px; margin-bottom: 24px; }
            .input-box { margin-bottom: 20px; }
            input { padding: 16px; font-size: 24px; }
            input::placeholder { font-size: 20px; }
            .btn-start { padding: 18px; font-size: 24px; }
            .footer { font-size: 16px; padding: 16px; }
            .tab-btn { font-size: 20px; padding: 10px; }
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <div class="card">
            
            <div id="login-view">
                <div class="status-badge" id="db-status">DB 연결 완료 ✨</div>
                <div class="icon-wrap">🏫💕</div>
                <h1>배정고등학교 수강신청 안내서</h1>
                <p class="desc">나의 진로와 적성에 맞는 과목을<br>신중하게 선택하고 저장해 보세요.</p>
                <div class="input-box">
                    <input type="text" id="studentId" placeholder="학번 5자리 입력" maxlength="5" pattern="\d*">
                </div>
                <button class="btn-start" onclick="login()">입장하기 ✨</button>
            </div>

            <div id="main-view" style="display: none;">
                <div class="status-badge" id="student-badge">배정고등학교 ✨</div>
                <div class="icon-wrap">📚💖</div>
                <h1 id="welcome-title">OOO 학생 환영합니다!</h1>
                
                <div class="tab-container">
                    <button class="tab-btn active" id="tab-btn1" onclick="changeTab(1)">과목 설계 📝</button>
                    <button class="tab-btn" id="tab-btn2" onclick="changeTab(2)">대학·학과 🏫</button>
                </div>

                <div id="tab-content1">
                    <p class="desc">아래에서 이수할 과목을 선택하고<br>저장하기 버튼을 눌러주세요.</p>
                    <div id="subject-list" style="text-align: left; max-width: 320px; margin: 0 auto 32px auto; font-size: 26px; line-height: 2;">
                        </div>
                    <button class="btn-start" onclick="saveSelection()">저장하기 💾</button>
                </div>

                <div id="tab-content2" style="display: none;">
                    <p class="desc">목표 대학과 학과의<br>핵심 권장 과목을 조회해 보세요.</p>
                    <div style="text-align: left; max-width: 380px; margin: 0 auto 32px auto; font-size: 22px; color: #555555; line-height: 1.6; background-color: #fffaf0; padding: 24px; border-radius: 20px; border: 3px dashed #fce4ec; box-sizing: border-box;">
                        <p style="margin: 0 0 12px 0; font-weight: bold; color: #6a5acd; font-size: 24px; text-align: center;">부산권/서울권 대학 정보 🔍</p>
                        <p style="margin: 0; text-align: center; color: #b0b8c1; font-size: 20px;">(여기에 편제표 시트와 연동되어 부산 및 서울 주요 대학의 핵심 과목 정보가 예쁘게 구성될 예정입니다! ✨)</p>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <div class="footer">
        <span class="heart-icon">💖</span> Made by 꿈을 응원하는 현정T <span class="heart-icon">💖</span>
    </div>
    
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxFFTb0vB25JuPk8YkMqIyygvsWnUe9BnxmrGJ9RQE17O2xrr66De9TeQf3snFQUiX3/exec";
        
        let globalStudentId = "";
        let globalStudentName = "";

        const sampleSubjects = ["공통 국어1", "문학", "독서", "대수", "수학II"];

        function login() {
            const studentId = document.getElementById('studentId').value;
            if(studentId.length !== 5 || isNaN(studentId)) {
                alert("학번 5자리를 정확히 입력해주세요. (예: 10101) 잉? 😿");
                return;
            }

            document.getElementById('db-status').innerText = "학생 정보 조회 중... ⏳";

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "login", studentId: studentId })
            })
            .then(res => res.json())
            .then(res => {
                if(res.name) {
                    globalStudentId = studentId;
                    globalStudentName = res.name;

                    document.getElementById('login-view').style.display = 'none';
                    document.getElementById('main-view').style.display = 'block';
                    
                    document.getElementById('welcome-title').innerText = `${res.name} 학생 환영합니다!`;
                    document.getElementById('student-badge').innerText = `${studentId} ${res.name} ✨`;

                    // 기본으로 1번 탭(과목 설계) 보여주기
                    changeTab(1);
                    renderSubjects();
                } else {
                    alert("등록되지 않은 학번입니다. 명단을 확인해 주세요! 잉? 😿");
                    document.getElementById('db-status').innerText = "DB 연결 완료 ✨";
                }
            })
            .catch(err => {
                alert("네트워크 연결에 실패했습니다. 다시 시도해 주세요.");
                document.getElementById('db-status').innerText = "DB 연결 완료 ✨";
            });
        }

        // 🔄 탭 전환 함수 (부드럽게 대상을 숨기고 보여주는 기능)
        function changeTab(tabIndex) {
            if (tabIndex === 1) {
                document.getElementById('tab-content1').style.display = 'block';
                document.getElementById('tab-content2').style.display = 'none';
                document.getElementById('tab-btn1').classList.add('active');
                document.getElementById('tab-btn2').classList.remove('active');
            } else {
                document.getElementById('tab-content1').style.display = 'none';
                document.getElementById('tab-content2').style.display = 'block';
                document.getElementById('tab-btn1').classList.remove('active');
                document.getElementById('tab-btn2').classList.add('active');
            }
        }

        function renderSubjects() {
            const listDiv = document.getElementById('subject-list');
            listDiv.innerHTML = "";
            sampleSubjects.forEach(sub => {
                listDiv.innerHTML += `
                    <label style="display: flex; align-items: center; gap: 12px; cursor: pointer; margin-bottom: 8px;">
                        <input type="checkbox" name="user-subject" value="${sub}" style="width:24px; height:24px; accent-color:#c3bef0;"> 
                        <span>${sub}</span>
                    </label>
                `;
            });
        }

        function saveSelection() {
            const checkedBoxes = document.querySelectorAll('input[name="user-subject"]:checked');
            if(checkedBoxes.length === 0) {
                alert("최소 한 개 이상의 과목을 선택해 주세요! 😿");
                return;
            }

            const selectedArray = Array.from(checkedBoxes).map(cb => cb.value);
            const subjectsString = selectedArray.join(", ");

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "save",
                    sheetName: "수강신청",
                    studentId: globalStudentId,
                    studentName: globalStudentName,
                    semester: "2학년 1학기",
                    subjects: subjectsString
                })
            }).then(() => {
                alert("수강신청 과목이 안전하게 저장되었습니다! 💖");
                location.reload(); 
            });
        }

        document.getElementById('studentId').addEventListener('keyup', function(event) {
            if (event.key === 'Enter') login();
        });
    </script>
</body>
</html>
