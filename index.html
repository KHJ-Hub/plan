<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>배정고 수강신청 안내서 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Hi+Melody&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #c3bef0; --bg-color: #fef1f8; --surface: #ffffff; --text-main: #333333; }
        body { background-color: var(--bg-color); font-family: 'Hi Melody', cursive; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .content-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 16px; padding-bottom: 110px; }
        .card { background-color: var(--surface); width: 100%; max-width: 560px; padding: 48px 56px; border-radius: 40px; box-shadow: 0 20px 50px rgba(255, 192, 203, 0.3); text-align: center; border: 3px solid #fce4ec; transition: all 0.4s ease; }
        .card.expanded { max-width: 820px; padding: 40px 48px; }
        .dashboard-box { background-color: #fffaf0; border: 3px dashed #fce4ec; border-radius: 20px; padding: 20px; margin-bottom: 24px; font-size: 22px; color: #555555; text-align: left; }
        .subject-item { display: flex; align-items: center; justify-content: flex-start; gap: 14px; cursor: pointer; margin-bottom: 10px; padding: 4px 12px; background-color: #fffaf0; border-radius: 12px; border: 1px solid #fef1f8; white-space: nowrap; }
        .desc-drawer { display: none; background-color: #fffaf0; padding: 10px 16px; border-radius: 12px; border: 2px dashed #fce4ec; margin-top: -6px; margin-bottom: 12px; font-size: 21px; color: #666666; text-align: left; animation: slideDown 0.2s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .btn-start { width: 100%; padding: 18px; font-size: 26px; color: white; background-image: linear-gradient(120deg, #c3bef0 0%, #fad0c4 100%); border: none; border-radius: 20px; cursor: pointer; }
        .footer { position: fixed; bottom: 0; width: 100%; text-align: center; padding: 24px; background-image: linear-gradient(to top, #fad0c4 0%, #ffd1ff 100%); border-radius: 30px 30px 0 0; }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="card" id="main-card">
            <div id="login-view">
                <h1>배정고 수강신청</h1>
                <input type="text" id="studentId" placeholder="학번 5자리" maxlength="5">
                <button class="btn-start" onclick="login()">입장하기</button>
            </div>
            <div id="main-view" style="display: none;">
                <h1 id="welcome-title"></h1>
                <div id="subject-list"></div>
            </div>
        </div>
    </div>
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxFFTb0vB25JuPk8YkMqIyygvsWnUe9BnxmrGJ9RQE17O2xrr66De9TeQf3snFQUiX3/exec";
        let subjectDB = {}; 

        function login() {
            const studentId = document.getElementById('studentId').value;
            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "login", studentId: studentId })
            })
            .then(res => res.json())
            .then(res => {
                subjectDB = res.db; 
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('main-view').style.display = 'block';
                renderSubjects();
            });
        }

        function renderSubjects() {
            const listDiv = document.getElementById('subject-list');
            listDiv.innerHTML = "";
            const subjects = subjectDB["2-1"]; 
            subjects.forEach((sub, index) => {
                const hasDesc = sub.desc && sub.desc.trim() !== "";
                listDiv.innerHTML += `
                    <div style="margin-bottom: 10px;">
                        <div class="subject-item">
                            <input type="checkbox" value="${sub.name}" style="width:24px; height:24px;">
                            <span onclick="toggleDrawer('${index}')" style="flex:1; text-align:left;">${sub.name} ${hasDesc ? '[✨ 안내문]' : ''}</span>
                        </div>
                        ${hasDesc ? `<div id="drawer-${index}" class="desc-drawer">${sub.desc}</div>` : ''}
                    </div>
                `;
            });
        }

        function toggleDrawer(id) {
            const drawer = document.getElementById(`drawer-${id}`);
            drawer.style.display = (drawer.style.display === "block") ? "none" : "block";
        }
    </script>
</body>
</html>
