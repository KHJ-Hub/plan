<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>배정고 수강신청 안내서 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Hi+Melody&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #c3bef0; --bg-color: #fef1f8; --text-main: #333333; }
        body { background-color: var(--bg-color); font-family: 'Hi Melody', cursive; margin: 0; padding-bottom: 100px; }
        
        /* 탭 스타일 */
        .tab-container { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .tab-btn { padding: 10px 20px; border-radius: 20px; border: 2px solid var(--primary); background: white; cursor: pointer; font-size: 20px; }
        .tab-btn.active { background: var(--primary); color: white; }

        /* 과목 박스 */
        .selection-area { display: none; max-width: 800px; margin: 0 auto; padding: 20px; }
        .subject-group { background: white; padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 2px solid #fce4ec; }
        .required-mark { color: #ff69b4; font-size: 16px; font-weight: bold; }
        
        /* 이전 코드의 스타일 유지 (생략된 부분은 위 코드와 동일하게 연결) */
        .selection-container { display: none; }
        /* ... (중략: 기존 CSS 동일) ... */
    </style>
</head>
<body>
    <div id="step2" class="selection-container" style="display:none;">
        <div class="tab-container">
            <button class="tab-btn active" onclick="showSemester('2-1')">2-1학기</button>
            <button class="tab-btn" onclick="showSemester('2-2')">2-2학기</button>
            <button class="tab-btn" onclick="showSemester('3-1')">3-1학기</button>
            <button class="tab-btn" onclick="showSemester('3-2')">3-2학기</button>
        </div>

        <div id="semester-content">
            </div>
    </div>

    <script>
        // 학기별 데이터 구조 (선생님이 안내서 보고 나중에 채우실 부분)
        const curriculum = {
            "2-1": {
                required: ["언어와 매체", "수학 I", "영어 I"],
                elective: ["문학(3)", "대수(3)", "물리학(3)", "사회와 문화(3)"]
            },
            "2-2": {
                required: ["독서", "수학 II", "영어 II"],
                elective: ["언어와 매체(3)", "미적분(3)", "화학(3)", "정치와 법(3)"]
            }
            // 3학년도 동일한 방식...
        };

        function showSemester(sem) {
            const content = document.getElementById('semester-content');
            const data = curriculum[sem];
            
            let html = `<div class="subject-group"><h3>필수과목 (자동 신청)</h3>`;
            data.required.forEach(sub => html += `<div>✅ ${sub}</div>`);
            
            html += `</div><div class="subject-group"><h3>선택과목</h3>`;
            data.elective.forEach(sub => {
                html += `<label><input type="checkbox"> ${sub}</label><br>`;
            });
            content.innerHTML = html + `</div>`;
        }

        // 페이지 로드 시 2-1학기 먼저 로드
        showSemester('2-1');
    </script>
</body>
</html>
