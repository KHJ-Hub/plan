<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>배정고등학교 수강신청 안내서</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #a084dc; 
            --primary-hover: #8367c7;
            --bg-color: #f4f5f7;
            --surface: #ffffff;
            --text-main: #191f28;
            --text-sub: #8b95a1;
        }
        
        body {
            background-color: var(--bg-color);
            font-family: 'Jua', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .content-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px; 
            padding-bottom: 100px; 
        }

        .card {
            background-color: var(--surface);
            width: 100%;
            max-width: 380px; 
            padding: 48px 32px; 
            border-radius: 28px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.08);
            text-align: center;
            box-sizing: border-box;
        }

        .icon-wrap {
            font-size: 56px; 
            margin-bottom: 20px;
        }
        
        h1 {
            margin: 0 0 16px 0;
            font-size: 30px; 
            font-weight: normal; 
            color: var(--text-main);
            letter-spacing: 1px;
            line-height: 1.3;
        }
        
        p.desc {
            margin: 0 0 40px 0;
            font-size: 18px; 
            color: var(--text-sub);
            word-break: keep-all;
            line-height: 1.5;
        }
        
        .input-box {
            margin-bottom: 32px;
        }
        
        input {
            width: 100%;
            padding: 20px; 
            font-family: 'Jua', sans-serif;
            font-size: 22px; 
            color: var(--text-main);
            background-color: #f9fafb;
            border: 2px solid transparent;
            border-radius: 16px;
            box-sizing: border-box;
            text-align: center;
            letter-spacing: 3px;
            transition: all 0.2s ease;
        }
        
        input::placeholder {
            color: #b0b8c1;
            letter-spacing: 1px;
        }
        
        input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: var(--surface);
            box-shadow: 0 0 0 4px rgba(160, 132, 220, 0.15);
        }
        
        .btn-start {
            width: 100%;
            padding: 20px; 
            font-family: 'Jua', sans-serif; 
            font-size: 22px; 
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        
        .btn-start:hover {
            background-color: var(--primary-hover);
        }
        
        .btn-start:active {
            transform: scale(0.98);
        }
        
        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            background-color: #f1f3f5;
            color: var(--text-sub);
            font-size: 15px;
            border-radius: 20px;
            margin-bottom: 24px;
        }

        .footer {
            position: fixed; 
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 24px; 
            font-size: 18px; 
            color: #8367c7; 
            background-color: #e9e6f2; 
            box-sizing: border-box;
            border-radius: 24px 24px 0 0; 
            z-index: 10;
        }

        .heart-icon {
            color: #e06c75; 
            display: inline-block;
            animation: pulse 1.5s infinite; 
            margin: 0 6px; 
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <div class="card">
            <div class="status-badge" id="db-status">데이터베이스 연결 대기중</div>
            
            <div class="icon-wrap">🏫</div>
            <h1>배정고등학교<br>수강신청 안내서</h1>
            <p class="desc">나의 진로와 적성에 맞는 과목을<br>신중하게 선택하고 저장해 보세요.</p>
            
            <div class="input-box">
                <input type="text" id="studentId" placeholder="학번 5자리 입력" maxlength="5" pattern="\d*">
            </div>
            
            <button class="btn-start" onclick="login()">입장하기</button>
        </div>
    </div>

    <div class="footer">
        <span class="heart-icon">❤️</span> 
        Made by 꿈을 응원하는 현정T 
        <span class="heart-icon">❤️</span>
    </div>
    
    <script>
        function login() {
            const studentId = document.getElementById('studentId').value;
            if(studentId.length !== 5 || isNaN(studentId)) {
                alert("학번 5자리를 정확히 입력해주세요. (예: 10101)");
                return;
            }
            alert(studentId + " 학생 확인 완료!");
        }

        // 🔥 엔터키 감지 기능 추가
        document.getElementById('studentId').addEventListener('keyup', function(event) {
            if (event.key === 'Enter') {
                login();
            }
        });
    </script>

</body>
</html>
