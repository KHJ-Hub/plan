<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>배정고 수강신청 안내서 💖</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Hi+Melody&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #c3bef0; 
            --bg-color: #fef1f8; 
            --surface: #ffffff;
            --text-main: #333333; 
        }
        
        body {
            background-color: var(--bg-color);
            font-family: 'Hi Melody', cursive; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(#ffe4e1 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .card {
            background-color: var(--surface);
            width: 90%;
            max-width: 500px; 
            padding: 40px; 
            border-radius: 40px; 
            box-shadow: 0 15px 30px rgba(255, 192, 203, 0.3);
            text-align: center;
            border: 3px solid #fce4ec; 
        }

        h1 { color: #6a5acd; font-size: 36px; margin: 0 0 15px 0; }
        p { color: #555; font-size: 22px; margin-bottom: 30px; }
        
        input {
            width: 100%;
            padding: 15px; 
            font-family: 'Hi Melody', cursive; 
            font-size: 22px; 
            border: 3px solid #fce4ec; 
            border-radius: 15px;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 20px;
        }
        
        button {
            width: 100%;
            padding: 15px; 
            background: linear-gradient(120deg, #c3bef0 0%, #fad0c4 100%);
            border: none;
            border-radius: 15px;
            color: white;
            font-family: 'Hi Melody', cursive;
            font-size: 22px;
            cursor: pointer;
        }

        .footer {
            position: fixed; bottom: 10px; font-size: 18px; color: #6a5acd;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>배정고 수강신청 안내서</h1>
        <p>나의 진로와 적성을 찾아보세요 💖</p>
        <input type="text" id="studentId" placeholder="학번 5자리 입력">
        <button onclick="check()">입장하기 ✨</button>
    </div>

    <div class="footer">Made by 꿈을 응원하는 현정T 💖</div>
    
    <script>
        function check() {
            const id = document.getElementById('studentId').value;
            alert(id + "번 학생, 환영합니다! 🥰");
        }
    </script>
</body>
</html>
