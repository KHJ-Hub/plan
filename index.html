<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>배정고 수강신청 안내서 💖</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hi+Melody&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #c3bef0; 
            --primary-hover: #b19cd9;
            --bg-color: #fef1f8; 
            --surface: #ffffff;
            --text-main: #5d5d5d; 
            --text-sub: #b0b8c1;
        }
        
        body {
            background-color: var(--bg-color);
            font-family: 'Hi Melody', cursive, sans-serif; 
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-image: radial-gradient(#ffe4e1 1px, transparent 1px), radial-gradient(#ffe4e1 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        .content-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px; 
            padding-bottom: 110px; 
        }

        .card {
            background-color: var(--surface);
            width: 100%;
            max-width: 420px; /* 한 줄로 길어진 제목을 위해 카드 너비 살짝 확보 */
            padding: 56px 36px; 
            border-radius: 40px; 
            box-shadow: 0 20px 50px rgba(255, 192, 203, 0.3);
            text-align: center;
            box-sizing: border-box;
            border: 3px solid #fce4ec; 
        }

        .icon-wrap {
            font-size: 64px; 
            margin-bottom: 24px;
            animation: twinkle 2s infinite;
        }
        
        h1 {
            margin: 0 0 20px 0;
            font-size: 40px; 
            color: #7b68ee; 
            letter-spacing: 1px;
            line-height: 1.2;
            font-weight: bold; 
            -webkit-text-stroke: 1.5px #7b68ee; 
        }
        
        p.desc {
            margin: 0 0 48px 0;
            font-size: 24px; 
            color: #555555; 
            word-break: keep-all;
            line-height: 1.4;
            font-weight: bold; 
            -webkit-text-stroke: 0.5px #555555; 
        }
        
        .input-box {
            margin-bottom: 36px;
        }
        
        input {
            width: 100%;
            padding: 22px; 
            font-family: 'Hi Melody', cursive, sans-serif; 
            font-size: 28px; 
            color: var(--text-main);
            background-color: #fffaf0; 
            border: 3px solid #fce4ec; 
            border-radius: 20px;
            box-sizing: border-box;
            text-align: center;
            letter-spacing: 4px;
            transition: all 0.2s ease;
            font-weight: bold;
        }
        
        input::placeholder {
            color: #d1d1d1;
            letter-spacing: 1px;
            font-size: 24px;
            font-weight: normal;
            -webkit-text-stroke: 0px; 
        }
        
        input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: var(--surface);
            box-shadow: 0 0 0 5px rgba(195, 190, 240, 0.3);
        }
        
        .btn-start {
            width: 100%;
            padding: 22px; 
            font-family: 'Hi Melody', cursive, sans-serif; 
            font-size: 28px; 
            color: white;
            background-image: linear-gradient(120deg, #c3bef0 0%, #fad0c4 100%);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(195, 190, 240, 0.4);
            transition: all 0.3s ease;
            font-weight: bold;
            -webkit-text-stroke: 0.5px white; 
        }
        
        .btn-start:hover {
            transform: translateY(-3px); 
            box-shadow: 0 12px 25px rgba(195, 190, 240, 0.5);
        }
        
        .btn-start:active {
            transform: translateY(1px) scale(0.98);
        }
        
        .status-badge {
            display: inline-block;
            padding: 10px 20px;
            background-color: #fff0f5; 
            color: #ff69b4; 
            font-size: 18px;
            border-radius: 20px;
            margin-bottom: 28px;
            border: 2px solid #fce4ec;
            font-weight: bold;
        }

        .footer {
            position: fixed; 
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 24px; 
            font-family: 'Hi Melody', cursive, sans-serif; 
            font-size: 24px; 
            color: #7b68ee; 
            font-weight: bold;
            -webkit-text-stroke: 0.5px #7b68ee; 
            background-image: linear-gradient(to top, #fad0c4 0%, #ffd1ff 100%);
            box-sizing: border-box;
            border-radius: 30px 30px 0 0; 
            z-index: 10;
            box-shadow: 0 -10px 30px rgba(255, 192, 203, 0.2);
        }

        .heart-icon {
            display: inline-block;
            animation: pulse 1.5s infinite; 
            margin: 0 6px; 
            -webkit-text-stroke: 0px; 
        }

        /* 🔥 스마트폰/태블릿을 위한 강력한 다이어트 마법 (스크롤 방지) */
        @media screen and (max-width: 768px) {
            .content-wrapper {
                padding-bottom: 80px; /* 푸터 여백 축소 */
            }
            .card {
                padding: 36px 20px; /* 카드 위아래 여백 대폭 축소 */
                border-radius: 30px;
            }
            .status-badge {
                margin-bottom: 16px; /* 뱃지 아래 여백 축소 */
                padding: 6px 16px;
            }
            .icon-wrap {
                font-size: 48px; /* 아이콘 축소 */
                margin-bottom: 12px;
            }
            h1 {
                font-size: 26px; /* 제목이 한 줄에 쏙 들어가도록 크기 조절 */
                margin-bottom: 12px;
                -webkit-text-stroke: 1px #7b68ee;
            }
            p.desc {
                font-size: 18px; /* 설명 크기 조절 */
                margin-bottom: 24px; /* 입력창과의 거리 축소 */
            }
            .input-box {
                margin-bottom: 20px;
            }
            input {
                padding: 16px; /* 입력창 높이 축소 */
                font-size: 24px;
            }
            input::placeholder {
                font-size: 20px;
            }
            .btn-start {
                padding: 16px; /* 버튼 높이 축소 */
                font-size: 24px;
            }
            .footer {
                font-size: 16px; 
                padding: 16px; 
                -webkit-text-stroke: 0.3px #7b68ee; 
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes twinkle {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1) rotate(5deg); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <div class="card">
            <div class="status-badge" id="db-status">DB 연결 대기중 ✨</div>
            
            <div class="icon-wrap">🏫💕</div>
            
            <h1>배정고등학교 수강신청 안내서</h1>
            <p class="desc">나의 진로와 적성에 맞는 과목을<br>신중하게 선택하고 저장해 보세요.</p>
            
            <div class="input-box">
                <input type="text" id="studentId" placeholder="학번 5자리 입력" maxlength="5" pattern="\d*">
            </div>
            
            <button class="btn-start" onclick="login()">입장하기 ✨</button>
        </div>
    </div>

    <div class="footer">
        <span class="heart-icon">💖</span> 
        Made by 꿈을 응원하는 현정T 
        <span class="heart-icon">💖</span>
    </div>
    
    <script>
        function login() {
            const studentId = document.getElementById('studentId').value;
            if(studentId.length !== 5 || isNaN(studentId)) {
                alert("학번 5자리를 정확히 입력해주세요. (예: 10101) 잉? 😿");
                return;
            }
            alert(studentId + " 학생 확인 완료! 🥰");
        }

        document.getElementById('studentId').addEventListener('keyup', function(event) {
            if (event.key === 'Enter') {
                login();
            }
        });
    </script>

</body>
</html>
