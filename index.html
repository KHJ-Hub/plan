<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고교학점제 과목 설계</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        :root {
            --primary: #9b82d3; /* 선생님이 선호하시는 연보라색 포인트 */
            --primary-hover: #8367c7;
            --bg-color: #f4f5f7; 
            --surface: #ffffff;
            --text-main: #191f28;
            --text-sub: #8b95a1;
        }
        body {
            background-color: var(--bg-color);
            font-family: 'Pretendard', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            position: relative; /* 서명을 하단에 고정하기 위한 설정 */
        }
        .card {
            background-color: var(--surface);
            width: 90%;
            max-width: 360px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.08);
            text-align: center;
            box-sizing: border-box;
            z-index: 1;
        }
        .icon-wrap {
            font-size: 44px;
            margin-bottom: 16px;
        }
        h1 {
            margin: 0 0 12px 0;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }
        p.desc {
            margin: 0 0 32px 0;
            font-size: 15px;
            color: var(--text-sub);
            word-break: keep-all;
            line-height: 1.5;
        }
        .input-box {
            position: relative;
            margin-bottom: 24px;
        }
        input {
            width: 100%;
            padding: 18px 20px;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
            background-color: #f9fafb;
            border: 2px solid transparent;
            border-radius: 16px;
            box-sizing: border-box;
            text-align: center;
            letter-spacing: 2px;
            transition: all 0.2s ease;
        }
        input::placeholder {
            color: #b0b8c1;
            font-weight: 400;
            letter-spacing: normal;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: var(--surface);
            box-shadow: 0 0 0 4px rgba(155, 130, 211, 0.15);
        }
        .btn-start {
            width: 100%;
            padding: 18px;
            font-size: 17px;
            font-weight: 700;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .btn-start:hover {
            background-color: var(--primary-hover);
        }
        .btn-start:active {
            transform: scale(0.98);
        }
        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            background-color: #f1f3f5;
            color: var(--text-sub);
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            margin-bottom: 24px;
        }
        
        /* 🔥 여기를 완전히 바꿨습니다! 캡처 화면처럼 크고 선명하게 하단 고정 */
        .footer-credit {
            position: absolute;
            bottom: 40px; /* 화면 맨 밑에서 띄우는 간격 */
            width: 100%;
            text-align: center;
            font-size: 18px; /* 글자 크기 확대 */
            color: #555555; /* 색상을 훨씬 진하게 변경 */
            font-weight: 600; /* 글자를 도톰하게 */
            letter-spacing: 1px; /* 자간을 살짝 넓혀서 고급스럽게 */
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="status-badge" id="db-status">데이터베이스 연결 대기중</div>
        
        <div class="icon-wrap">🧭</div>
        <h1>과목 설계 시작하기</h1>
        <p class="desc">나의 진로에 맞는 과목을<br>선택하고 저장해 보세요.</p>
        
        <div class="input-box">
            <input type="text" id="studentId" placeholder="학번 5자리 입력" maxlength="5" pattern="\d*">
        </div>
        
        <button class="btn-start" onclick="login()">입장하기</button>
    </div>
