<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>배정고 수강신청 안내서 💖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hi+Melody&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #c3bef0; --bg-color: #fef1f8; --surface: #ffffff; --text-main: #333333; }
        body { background-color: var(--bg-color); font-family: 'Hi Melody', cursive, sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; background-image: radial-gradient(#ffe4e1 1px, transparent 1px); background-size: 40px 40px; }
        .content-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 16px; padding-bottom: 110px; }
        .card { background-color: var(--surface); width: 100%; max-width: 560px; padding: 48px 56px; border-radius: 40px; box-shadow: 0 20px 50px rgba(255, 192, 203, 0.3); text-align: center; border: 3px solid #fce4ec; }
        h1 { margin: 0 0 16px 0; font-size: 38px; color: #6a5acd; font-weight: bold; white-space: nowrap; }
        p.desc { margin: 0 0 32px 0; font-size: 24px; color: #555555; font-weight: bold; }
        input { width: 100%; padding: 18px; font-size: 24px; border: 3px solid #fce4ec; border-radius: 20px; text-align: center; box-sizing: border-box; margin-bottom: 20px; font-family: 'Hi Melody', cursive; }
        .btn-start { width: 100%; padding: 18px; background: linear-gradient(120deg, #c3bef0 0%, #fad0c4 100%); border: none; border-radius: 20px; color: white; font-size: 26px; cursor: pointer; font-family: 'Hi Melody', cursive; font-weight: bold; }
        
        /* 과목 선택 시스템 스타일 (디자인 통일) */
        #main-system { display: none; width: 100%; max-width: 560px; }
        .tab-container { display: flex; justify-content: center; gap: 5px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 15px; border-radius: 15px; border: 2px solid var(--primary); background: white; cursor: pointer; font-size: 20px; color: #6a5acd; font-family: 'Hi Melody', cursive; }
        .tab-btn.active { background: var(--primary); color: white; }
        .group { background: white; padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 2px solid #fce4ec; text-align: left; }
        .group-title { font-size: 26px; color: #6a5acd; margin-bottom: 10px; border-bottom: 2px dashed #fce4ec; }
        .subject-item { font-size: 22px; padding: 5px 0; display: block; }
        
        .footer { position: fixed; bottom: 0; width: 100%; text-align: center; padding: 24px; font-family: 'Hi Melody', cursive; font-size: 24px; color: #6a5acd; font-weight: bold; background: white; border-top: 3px solid #fce4ec; }
        
        @media screen and (max-width: 768px) { .card { padding: 40px 24px; } h1 { font-size: 28px; } }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <div id="login-card" class="card">
            <h1>배정고등학교 수강신청 안내서</h1>
            <p class="desc">나의 진로와 적성을 찾아보세요 ✨</p>
            <input type="text" id="studentId" placeholder="학번 5자리 입력">
            <button class="btn-start" onclick="login()">입장하기 ✨</button>
        </div>

        <div id="main-system">
            <div class="tab-container">
                <button class="tab-btn active" onclick="loadSem('2-1')">2-1</button>
                <button class="tab-btn" onclick="loadSem('2-2')">2-2</button>
            </div>
            <div id="app"></div>
            <button class="btn-start" onclick="alert('제출 완료!')">신청하기 💾</button>
        </div>
    </div>

    <div class="footer">Made by 꿈을 응원하는 현정T 💖</div>
    
    <script>
        function login() {
            const studentId = document.getElementById('studentId').value;
            if(studentId.length === 5) {
                document.getElementById('login-card').style.display = 'none';
                document.getElementById('main-system').style.display = 'block';
                loadSem('2-1');
            } else { alert("학번 5자리를 정확히 입력해주세요! 😿"); }
        }
        document.getElementById('studentId').addEventListener('keyup', (e) => { if(e.key === 'Enter') login(); });

        function loadSem(sem) {
            const app = document.getElementById('app');
            const data = {
                "2-1": { required: ["공통국어1"], elective: ["문학", "대수"] },
                "2-2": { required: ["공통국어1"], elective: ["독서", "수학II"] }
            };
            const current = data[sem];
            let html = `<div class="group"><div class="group-title">🔒 필수과목</div>`;
            current.required.forEach(s => html += `<div class="subject-item">✅ ${s}</div>`);
            html += `</div><div class="group"><div class="group-title">🎁 선택과목</div>`;
            current.elective.forEach(s => html += `<label class="subject-item"><input type="checkbox"> ${s}</label>`);
            app.innerHTML = html + `</div>`;
        }
    </script>
</body>
</html>
