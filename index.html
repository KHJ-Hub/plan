<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>배정고 수강신청 안내서 💖</title>
    
    <style>
        /* 🔥 폰트가 깨지지 않고 무조건 적용되도록 직접 불러오기 */
        @font-face {
            font-family: 'KOTRA_hope';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2110@1.0/KOTRA_hope.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --primary: #c3bef0; 
            --primary-hover: #b19cd9;
            --bg-color: #fef1f8; 
            --surface: #ffffff;
            --text-main: #5d5d5d; 
            --text-sub: #b0b8c1;
        }
        
        body {
            background-color: var(--bg-color);
            font-family: 'KOTRA_hope', sans-serif; /* 귀여운 폰트 적용 완료 */
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-image: radial-gradient(#ffe4e1 1px, transparent 1px), radial-gradient(#ffe4e1 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        .content-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px; 
            padding-bottom: 110px; 
        }

        .card {
            background-color: var(--surface);
            width: 100%;
            max-width: 380px; 
            padding: 56px 36px; 
            border-radius: 40px; 
            box-shadow: 0 20px 50px rgba(255, 192, 203, 0.3);
            text-align: center;
            box-sizing: border-box;
            border: 3px solid #fce4ec; 
        }

        .icon-wrap {
            font-size: 64px; 
            margin-bottom: 24px;
            animation: twinkle 2s infinite;
        }
        
        h1 {
            margin: 0 0 20px 0;
            font-size: 34px; 
            color: #7b68ee; 
            letter-spacing: 1px;
            line-height: 1.2;
            font-weight: normal;
        }
        
        p.desc {
            margin: 0 0 48px 0;
            font-size: 20px; 
            color: #888;
            word-break: keep-all;
            line-height: 1.4;
        }
        
        .input-box {
            margin-bottom: 36px;
        }
        
        input {
            width: 100%;
            padding: 22px; 
            font-family: 'KOTRA_hope', sans-serif; 
            font-size: 26px; 
            color: var(--text-main);
            background-color: #fffaf0; 
            border: 3px solid #fce4ec; 
            border-radius: 20px;
            box-sizing: border-box;
            text-align: center;
            letter-spacing: 4px;
            transition: all 0.2s ease;
        }
        
        input::placeholder {
            color: #d1d1d1;
            letter-spacing: 1px;
            font-size: 22px;
        }
        
        input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: var(--surface);
            box-shadow: 0 0 0 5px rgba(195, 190, 240, 0.3);
        }
        
        .btn-start {
            width: 100%;
            padding: 22px; 
            font-family: 'KOTRA_hope', sans-serif; 
            font-size: 26px; 
            color: white;
            background-image: linear-gradient(120deg, #c3bef0 0%, #fad0c4 100%);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(195, 190, 240, 0.4);
            transition: all 0.3s ease;
        }
        
        .btn-start:hover {
            transform: translateY(-3px); 
            box-shadow: 0 12px 25px rgba(195, 190, 240, 0.5);
        }
        
        .btn-start:active {
            transform: translateY(1px) scale(0.98);
        }
        
        .status-badge {
            display: inline-block;
            padding: 10px 20px;
            background-color: #fff0f5; 
            color: #ff69b4; 
            font-size: 16px;
            border-radius: 20px;
            margin-bottom: 28px;
            border: 2px solid #fce4ec;
        }

        /* 🔥 서명 글씨를 흰색에서 눈에 확 띄는 진보라색으로 변경! */
        .footer {
            position: fixed; 
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 28px; 
            font-size: 22px; 
            color: #7b68ee; /* 진한 보라색 */
            font-weight: bold;
            background-image: linear-gradient(to top, #fad0c4 0%, #ffd1ff 100%);
            box-sizing: border-box;
            border-radius: 30px 30px 0 0; 
            z-index: 10;
            box-shadow: 0 -10px 30px rgba(255, 192, 203, 0.2);
        }

        .heart-icon {
            display: inline-block;
            animation: pulse 1.5s infinite; 
            margin: 0 6px; 
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes twinkle {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1) rotate(5deg); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <div class="card">
            <div class="status-badge" id="db-status">DB 연결 대기중 ✨</div>
            
            <div class="icon-wrap">🏫💕</div>
            
            <h1>배정고등학교<br>수강신청 안내서</h1>
            <p class="desc">나의 진로와 적성에 맞는 과목을<br>신중하게 선택하고 저장해 보세요.</p>
            
            <div class="input-box">
                <input type="text" id="studentId" placeholder="학번 5자리 입력" maxlength="5" pattern="\d*">
            </div>
            
            <button class="btn-start" onclick="login()">입장하기 ✨</button>
        </div>
    </div>

    <div class="footer">
        <span class="heart-icon">💖</span> 
        Made by 꿈을 응원하는 현정T 
        <span class="heart-icon">💖</span>
    </div>
    
    <script>
        function login() {
            const studentId = document.getElementById('studentId').value;
            if(studentId.length !== 5 || isNaN(studentId)) {
                alert("학번 5자리를 정확히 입력해주세요. (예: 10101) 잉? 😿");
                return;
            }
            alert(studentId + " 학생 확인 완료! 🥰");
        }

        // 엔터키 감지 
        document.getElementById('studentId').addEventListener('keyup', function(event) {
            if (event.key === 'Enter') {
                login();
            }
        });
    </script>

</body>
</html>
